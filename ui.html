    :root { color-scheme: dark; font: 12px Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; color: #CBE3FF; background: #1A1113; }
    h1 { margin: 0 0 4px; font-size: 15px; }
    #status { margin-bottom: 14px; color: #CBE3FF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    label { display: block; margin: 9px 0; color: #CBE3FF; }
    input { margin-right: 7px; accent-color: #CBE3FF; }
    textarea { width: 100%; height: 420px; resize: none; padding: 12px; border: 1px solid #CBE3FF; border-radius: 10px; color: #CBE3FF; background: #24191C; font: 12px/1.5 "Space Grotesk Mono", ui-monospace, SFMono-Regular, Consolas, monospace; }
    button { width: 100%; margin-top: 14px; padding: 12px 18px; border: 0; border-radius: 999px; color: #1A1113; background: #CBE3FF; font: 500 12px/1.2 "Space Grotesk", Inter, system-ui, sans-serif; cursor: pointer; transition: background .16s ease, transform .16s ease, box-shadow .16s ease; }
    button:hover:not(:disabled) { background: #E2F0FF; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(203, 227, 255, .16); }
    button:active:not(:disabled) { background: #B7D4F2; transform: translateY(0); box-shadow: none; }
    button:focus-visible { outline: 2px solid #CBE3FF; outline-offset: 3px; }
    button:disabled { opacity: .45; cursor: default; }
    #feedback { min-height: 18px; margin-top: 8px; color: #CBE3FF; text-align: center; }
  </style>
</head>
<body>
  <h1>Copy Figma Specs</h1>
  <div id="status">Select a layer to inspect.</div>
  <label><input id="children" type="checkbox" checked> Include children</label>
  <label><input id="ids" type="checkbox"> Include layer IDs</label>
  <textarea id="output" readonly placeholder="Your Figma specs will appear here."></textarea>
  <button id="copy" disabled>Copy Figma Specs</button>
  <div id="feedback"></div>
  <script>
    const status = document.getElementById('status');
    const output = document.getElementById('output');
    const copy = document.getElementById('copy');
    const feedback = document.getElementById('feedback');
    const children = document.getElementById('children');
    const ids = document.getElementById('ids');

    function refresh() {
      parent.postMessage({ pluginMessage: { type: 'refresh', includeChildren: children.checked, includeIds: ids.checked } }, '*');
    }

    children.onchange = refresh;
    ids.onchange = refresh;
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(output.value);
      } catch (_) {
        output.select();
        document.execCommand('copy');
      }
      feedback.textContent = 'Copied to clipboard';
      setTimeout(() => feedback.textContent = '', 1800);
    };

    window.onmessage = (event) => {
      const message = event.data.pluginMessage;
      if (!message || message.type !== 'selection') return;
      status.textContent = message.name || message.message;
      output.value = message.specs || '';
      copy.disabled = !message.specs;
    };
  </script>
</body>
</html>
